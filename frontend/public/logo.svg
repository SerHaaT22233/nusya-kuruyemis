<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="nutGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="50%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFB300"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7D1F00" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fıstık shape -->
  <ellipse cx="44" cy="40" rx="34" ry="38" fill="url(#nutGradient)" filter="url(#shadow)"/>
  <ellipse cx="44" cy="28" rx="16" ry="18" fill="url(#sunGradient)" opacity="0.55"/>
  
  <!-- N letter -->
  <path d="M 32 26 L 32 58 M 32 26 L 44 38 L 56 26 M 44 38 L 44 58" 
        stroke="#FFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- NUSYA text -->
  <text x="92" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#4D0F00" letter-spacing="4">NUSYA</text>
  <text x="92" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#7D4F2A" letter-spacing="5">KURUYEMİŞ</text>
</svg>
